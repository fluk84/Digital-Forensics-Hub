name: CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Run Type Check & Lint
        run: npm run lint

      - name: Build App
        run: npm run build

      - name: Job Diagnostic Summary
        if: always()
        run: |
          echo "=========================================="
          echo "Job Status: ${{ job.status }}"
          echo "Check Run ID: ${{ job.check_run_id }}"
          echo "Workflow Ref: ${{ job.workflow_ref }}"
          echo "Workflow File Path: ${{ job.workflow_file_path }}"
          echo "Workflow SHA: ${{ job.workflow_sha }}"
          echo "Workflow Repository: ${{ job.workflow_repository }}"
          echo "=========================================="
